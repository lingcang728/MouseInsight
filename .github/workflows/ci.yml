name: CI

# Unsigned tests and packaging only. Never reads Apple secrets and never
# references the production-signing environment.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # No toolchain input: the action reads rust-toolchain.toml (pinned channel).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-audit

      # Lockfile lives in src-tauri/; rustsec/audit-check only scans ./Cargo.lock.
      - name: Dependency audit
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Install frontend dependencies
        run: npm ci

      - name: Release version consistency
        run: node scripts/check-release-version.mjs

      - name: Frontend unit tests
        run: node tests/frontend_logic.test.mjs

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Frontend production build
        run: npm run build

      - name: Windows NSIS bundle
        run: npm run tauri -- build --bundles nsis

  macos:
    name: macOS
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # rust-toolchain.toml overrides the action's default toolchain, so the
      # action's `targets:` input would install them on the wrong toolchain;
      # add them explicitly so rustup applies the repo override.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Add universal macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Release version consistency
        run: node scripts/check-release-version.mjs

      - name: Frontend unit tests
        run: node tests/frontend_logic.test.mjs

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Frontend production build
        run: npm run build

      - name: Unsigned universal app and DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --no-sign

      - name: Confirm universal binary
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle -name '*.app' -type d | head -n 1)
          if [[ -z $app ]]; then
            echo "unsigned universal .app was not produced" >&2
            find src-tauri/target -name '*.app' -o -name '*.dmg' >&2 || true
            exit 1
          fi
          bin="$app/Contents/MacOS/Mouse Insight"
          if [[ ! -f $bin ]]; then
            echo "missing app binary: $bin" >&2
            exit 1
          fi
          archs=$(lipo -archs "$bin")
          echo "universal binary archs: $archs"
          echo "$archs" | grep -q 'x86_64'
          echo "$archs" | grep -q 'arm64'
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle -name '*.dmg' | head -n 1)
          if [[ -z $dmg ]]; then
            echo "unsigned universal .dmg was not produced" >&2
            exit 1
          fi
          echo "app=$app"
          echo "dmg=$dmg"
