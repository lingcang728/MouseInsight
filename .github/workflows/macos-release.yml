name: macOS Release

# Formal macOS signing / notarization / GitHub Release upload.
# Triggered only by version tags. Apple credentials live exclusively in the
# production-signing GitHub Environment and are not available until kmgcc
# approves the deployment.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production-signing-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Tag matches application version
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Frontend unit tests
        run: node tests/frontend_logic.test.mjs

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend production build
        run: npm run build

  sign-and-release:
    name: Sign, notarize, and upload
    needs: verify
    runs-on: macos-14
    timeout-minutes: 120
    environment: production-signing
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z ${APPLE_CERTIFICATE:-} || -z ${APPLE_CERTIFICATE_PASSWORD:-} ]]; then
            echo "production-signing is missing APPLE_CERTIFICATE or APPLE_CERTIFICATE_PASSWORD" >&2
            exit 1
          fi
          cert_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          export CERT_PATH="$cert_path"
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE"])
          )
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [[ -z $identity ]]; then
            echo "imported certificate does not contain a Developer ID Application identity" >&2
            security find-identity -v -p codesigning "$keychain_path"
            exit 1
          fi
          printf '%s\n' "$keychain_password" > "$RUNNER_TEMP/keychain.password"
          chmod 600 "$RUNNER_TEMP/keychain.password"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "imported signing identity: $identity"

      - name: Write App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z ${APPLE_API_ISSUER:-} || -z ${APPLE_API_KEY:-} || -z ${APPLE_API_PRIVATE_KEY_BASE64:-} ]]; then
            echo "production-signing is missing APPLE_API_ISSUER, APPLE_API_KEY, or APPLE_API_PRIVATE_KEY_BASE64" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          export KEY_PATH="$key_path"
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_API_PRIVATE_KEY_BASE64"])
          )
          PY
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple universal DMG
        shell: bash
        run: |
          set -euo pipefail
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY_BASE64
          npm run tauri -- build --target universal-apple-darwin --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

      - name: Locate bundle and confirm universal binary
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle -name '*.app' -type d | head -n 1)
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle -name '*.dmg' | head -n 1)
          if [[ -z $app || -z $dmg ]]; then
            echo "signed universal .app/.dmg was not produced" >&2
            find src-tauri/target -name '*.app' -o -name '*.dmg' >&2 || true
            exit 1
          fi
          bin="$app/Contents/MacOS/Mouse Insight"
          archs=$(lipo -archs "$bin")
          echo "universal binary archs: $archs"
          echo "$archs" | grep -q 'x86_64'
          echo "$archs" | grep -q 'arm64'
          mkdir -p dist-macos
          cp "$dmg" dist-macos/
          dmg_name=$(basename "$dmg")
          (
            cd dist-macos
            shasum -a 256 "$dmg_name" > SHA256SUMS-macos.txt
          )
          echo "APP_PATH=$app" >> "$GITHUB_OUTPUT"
          echo "DMG_PATH=$dmg" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "app=$app"
          echo "dmg=$dmg"

      - name: Verify signature, Gatekeeper, and stapling
        shell: bash
        run: bash scripts/verify-macos-bundle.sh "${{ steps.bundle.outputs.APP_PATH }}" "${{ steps.bundle.outputs.DMG_PATH }}"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mouse-Insight-macos-universal-${{ github.ref_name }}
          path: |
            dist-macos/${{ steps.bundle.outputs.DMG_NAME }}
            dist-macos/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Upload Draft GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "refusing to publish assets for non-version ref: $tag" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "Mouse Insight ${version}" \
              --notes "Draft release for ${tag}. Windows assets may still be attached manually."
          fi
          gh release upload "$tag" \
            "dist-macos/${{ steps.bundle.outputs.DMG_NAME }}" \
            dist-macos/SHA256SUMS-macos.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Scrub signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n ${KEYCHAIN_PATH:-} ]]; then
            password=$(cat "$RUNNER_TEMP/keychain.password" 2>/dev/null)
            if [[ -n $password ]]; then
              security lock-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
              security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
            else
              security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
            fi
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f "$RUNNER_TEMP/keychain.password"
          if [[ -n ${APPLE_API_KEY_PATH:-} ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
          exit 0
