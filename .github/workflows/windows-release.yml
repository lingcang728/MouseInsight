name: Windows Release

# Tag-triggered Windows build: unsigned NSIS installer + portable zip +
# .pdb symbols, uploaded to the GitHub Release for the tag. There is no
# Windows code-signing certificate in CI; SHA256SUMS is the integrity record.
# Local packaging stays on scripts/package-release.ps1.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and upload
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # No toolchain input: the action reads rust-toolchain.toml (pinned channel).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Tag matches application version
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Frontend unit tests
        run: node tests/frontend_logic.test.mjs

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Windows NSIS bundle
        run: npm run tauri -- build --bundles nsis

      - name: Stage publish artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dist = 'dist-windows'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $setup = "src-tauri/target/release/bundle/nsis/Mouse Insight_${version}_x64-setup.exe"
          $exe = 'src-tauri/target/release/Mouse Insight.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "missing NSIS bundle: $setup" }
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing exe: $exe" }
          # Dotted names match the release URLs written by package-release.ps1.
          Copy-Item -LiteralPath $setup -Destination "$dist/Mouse.Insight_${version}_x64-setup.exe"
          Copy-Item -LiteralPath $exe -Destination "$dist/Mouse.Insight.exe"
          $zipStage = New-Item -ItemType Directory -Path "$dist/.zip-stage/data" -Force
          Copy-Item -LiteralPath $exe -Destination "$zipStage/Mouse Insight.exe"
          [IO.File]::WriteAllText("$zipStage/data/.portable", '')
          Compress-Archive -Path "$zipStage/*" -DestinationPath "$dist/Mouse.Insight_${version}_portable.zip" -Force
          Remove-Item -LiteralPath $zipStage -Recurse -Force
          # Keep PDBs next to the binary for post-release crash analysis.
          New-Item -ItemType Directory -Path "$dist/symbols" -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/*.pdb' -Destination "$dist/symbols" -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $dist -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Out-File -FilePath "$dist/SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem -LiteralPath $dist -Recurse -File | Select-Object FullName, Length

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mouse-Insight-windows-${{ github.ref_name }}
          path: dist-windows/
          if-no-files-found: error

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "refusing to publish assets for non-version ref: $tag" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Mouse Insight ${version}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          shopt -s nullglob
          gh release upload "$tag" \
            dist-windows/*.exe dist-windows/*.zip dist-windows/SHA256SUMS.txt \
            dist-windows/symbols/*.pdb \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
